name: runtime

on:
  push:
    paths-ignore: ["spikes/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.0"
          actions-cache-folder: .xmake-cache
          actions-cache-key: xmake-${{ hashFiles('xmake.lua') }}

      - name: Fetch CommonLibSSE-NG
        shell: pwsh
        run: ./scripts/fetch-commonlib.ps1

      - name: Configure
        shell: pwsh
        run: |
          xmake f -y -v -p windows -a x64 -m release 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            # surface the log tail as annotations (readable without admin rights)
            $m = (@(Get-Content configure.log -Tail 70) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=configure log::$m"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          xmake -y 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $m = (@(Get-Content build.log -Tail 70) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=build log::$m"
            exit 1
          }

      - name: Unit tests
        shell: pwsh
        run: |
          xmake test 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) {
            $m = (@(Get-Content test.log -Tail 70) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=unit tests::$m"
            exit 1
          }

      # Never commit the DLL or PDB: the artifact is the only way a build leaves CI.
      # Stage the Data/ layout; the artifact is zipped by GitHub, so the zip root is Data/ (MO2 and manual installs both work).
      - name: Stage package
        shell: pwsh
        run: |
          $version = (Select-String -Path xmake.lua -Pattern 'local VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          "PACKAGE_NAME=Inkwell-$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force package/SKSE/Plugins, package/Interface/Inkwell | Out-Null
          Copy-Item build/windows/x64/release/Inkwell.dll, build/windows/x64/release/Inkwell.pdb package/SKSE/Plugins
          Copy-Item Interface/Inkwell/SystemMenuInjector.swf package/Interface/Inkwell

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: package
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Inkwell-papyrus-source
          path: papyrus/Source
          if-no-files-found: error
