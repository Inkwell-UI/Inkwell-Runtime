; Example per-mod INI for the runtime test menus (copy to Data/SKSE/Plugins/Inkwell/InkwellTest.ini).
; The runtime reads the section [Menu.<name>] of each loaded menu.

[Menu.InkwellTest_B]
; Moves the hotkey from P (25) to U (22).
OpenKey=22
UIScale=1.5
OffsetX=40
OffsetY=-20
Theme=dark

[Menu.InkwellTest_C]
; 0 removes the hotkey of the JSON: this menu can then only be opened from Papyrus.
OpenKey=0
UIScale=9

[Menu.InkwellTest_A]
; Out-of-range and unknown values are reported in Inkwell.log and ignored.
OffsetX=5000
NoSuchKey=1

; Any section can be read by a menu with inkwell.getSetting("Custom", "Greeting", "none").
[Custom]
Greeting=hello from the ini
